<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/home.css" />
    <title>BloomsKimono</title>

</head>

<body>
    <div class="header">
        <h1> Bloom's Kimono </h1>
        <p>Início</p>

    <div class="promo-containers">

            <img src="img/kimono_banner_sale.jpg" alt="">
        </div> 
    </div>

    <div class="legend">
        <h2>- Para você! -</h2>
    </div>

    <div class="products-session" id="produto"> 
    </div>
    </div>

    <div class="flower-background">
            <figure>
                <img src="img/sakuraFlower.png" alt="Sakura Flowers">

    </div>
        <div class="flower3-background">
            <figure>
