<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/home.css" />
    <title>BloomsKimono</title>

</head>

<body>
    <div class="header">
        <h1> Bloom's Kimono </h1>
        <p>Início</p>

    </div>

    <div class="promo-containers">
        <div class="promo-container"></div> 
    </div>

    <div class="legend">
        <h2>- Para você! -</h2>
    </div>

    <div class="products-session" id="produto"> 
    </div>
    </div>

    <div class="flower-background">
            <figure>
                <img src="img/sakuraFlower.png" alt="Sakura Flowers">
            </figure>
    </div>
        <div class="flower3-background">
            <figure>
                <img src="img/sakuraFlower3.png" alt="Sakura Flowers">
            </figure>
        </div>
    <div class="cart">
        <div class="cart-title">
            <h1>Seu carrinho</h1>
        </div>
        <div class="cart-container-is">
            <div class="cart-content">
                <div class="cart-box">
                    <img src="https://i.pinimg.com/736x/79/2a/ff/792aff8ab6df34b17444c1871b06aefe.jpg" alt="" class="cart-img">
                    <div class="detail-box">
                        <div class="cart-product-title">Kimono rosa</div>
                        <div class="cart-price">119.90 (-29%)</div>
                        <input type="number" value="1" class="cart-quantity">
                    </div>
                    <div class='cart-remove-item'>🗑️</div>

                </div>
            </div>

            <div class="total">
                <div class="total-">Total: </div>
                <div class="total-price"> 0</div>
            </div>

            <button type="button" class="btn-buy"> Comprar agora </button>

            


        </div>
    </div>

    
    <script src = "js/home.js"></script>


</body>
</html>
