<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/paypage.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playwrite+CU+Guides&display=swap" rel="stylesheet">
    <title>BloomsKimono</title>

</head>

<body>
    
<div class="header">
        <h1>Bloom's Kimono</h1>
        <p> Pagamento </p>
</div>
<div class="container">
    <h1>Escolha o método de pagamento</h1>

    <form>
        <div class="form-100">
            <label >Email:</label>
            <input type="email">
        </div>

        <div class="form-100">
            <label>Dados do cartão</label>
            <input type="text" placeholder="1234 1234 1234 1234" /> 
        </div>
            <div class="form-50">
                <input type="text" 
                placeholder="12/23"
                />
                
                <input type="text" 
                placeholder="CVC" 
                />
            </div>
        <div class="form-100">
            <label>Nome do cartão</label>
            <input type="text" 
            placeholder="Nome do cartão" />
        </div>

        <div class="form-100">
            <label>Endereço</label>
            <input type="text" placeholder="Ex: Rua 1, Av. 32..." /> 
        </div>

        <div class="payment-options">
            <label for="payment-options">Escolha o tipo do cartão</label>

            <div class="option">
                <input type="radio" id="credito" name="tipoCartao" />
                <span>Cartão de crédito</span>
            </div>

            <div class="option">
                <input type="radio" id="debito" name="tipoCartao" />
                <span>Cartão de débito</span>
            </div>
        </div>

        <div class="form-100">
            <input type="submit" 
                    name="acao" 
                    value="Realizar pagamento" 
                    id ="btnPay"
                    class="btn-pay"
                    />
        </div>
        

    </form>

</div>

</body>
</html>
