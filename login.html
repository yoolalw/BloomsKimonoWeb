<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playwrite+CU+Guides&display=swap" rel="stylesheet">
    <title>BloomsKimono</title>

</head>

<body>
<div class="container">
    <div class="header">
        <h1>Bloom's Kimono</h1>
    </div>

    <div class="login-container">
        <h1>Login!</h1>
        <p> Bem vindo de volta!
        </p>
            <form id="loginForm">
                <div class="box-input">
                    <label for="emailUser">Email</label>
                    <input type="email"
                            name="emailUser"
                            id="emailUser"
                            placeholder="Insira seu email aqui"
                            required
                            />
                </div>
                    <div class="box-input">
                        <label for="senhaUser"> Senha </label>
                        <input type="password"
                               name="senhaUser"
                               id="senhaUser"
                               placeholder="Insira sua senha aqui"
                               required
                            />
                    </div>

                <input type="submit" value="Entrar" class="btn-submit"/>
                <p id="message"></p>
            </form>

            

    </div>
</div>
</div>
    <script src="js/login.js"></script>
</body>
</html>
